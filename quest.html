<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Интерактивная часть</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="logos/Group 1.png" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="header1">
            <div class="header1__container">
                <nav class="header1__nav">
                    <ul class="header1__list">
                        <li>
                            <a class="header1__list-link " href="index.html">Главная</a>
                        </li>
                        <li class="header1__list-item">
                            <a class="header1__list-link active" href="quest.html">Интерактивная часть</a>
                        </li> 
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <section class="interaktiv">
                <div class="map__container">
                    <div class="map">
                        <div id="start-screen">
                            <p class="vyb">Выберете точку с которой вам удобнее всего начать маршрут</p>
                            <div class="map_buttons">  
                                <img class="my-map" src="gallery/всеточки.jpg" alt="">
                                <div class="choice_buttons">
                                    <button type="button" class="map-btn map-btn--1" data-start="center" aria-label="Старт: Центр"></button>
                                    <button type="button" class="map-btn map-btn--2" data-start="school" aria-label="Старт: Школьная"></button>
                                    <button type="button" class="map-btn map-btn--3" data-start="lyapuha" aria-label="Старт: Ляпуха"></button>
                                </div>
                            </div>
                        </div>
                        <div id="quest-screen" class="map" hidden>
                            <button type="button" id="back-btn" class="back-btn">Назад к выбору старта</button>
                            <h2 id="route-heading"></h2>
                            <div class="map_buttons">
                                <img id="route-map-img" class="my-map" src="" alt="Карта выбранного маршрута">
                                <div id="route-points" class="choice-buttons"></div>
                            </div>
                            <div id="point-info"></div>
                        </div>   
                    </div>
                </div>
            </section>
        </main>
        <script src="quest.js"></script>
    </body>
</html>
