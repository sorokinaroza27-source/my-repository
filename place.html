<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Объект маршрута — Посёлок Виля</title>
  <link rel="stylesheet" href="place.css">
</head>
<body>
  <main class="place-page">
    <div class="place-container">
      <a href="route1.html" class="place-back" id="backToMap">← Назад к карте</a>

      <article class="place-card" id="placeCard">
        <h1 class="place-title" id="placeTitle">Объект маршрута</h1>
        <div class="place-media" id="placeMedia"></div>
        <div class="place-story" id="placeStory"></div>

        <div class="place-actions">
          <button type="button" class="place-quiz-btn" id="openQuizBtn">Чек-ап знаний</button>
        </div>

        <section class="place-quiz" id="placeQuiz" hidden>
          <h2 class="place-quiz__heading">Проверь себя</h2>
          <p class="place-quiz__question" id="quizQuestion"></p>
          <div class="place-quiz__options" id="quizOptions"></div>
          <p class="place-quiz__result" id="quizResult"></p>
        </section>
      </article>
    </div>
  </main>

  <script src="place.js"></script>
</body>
</html>
