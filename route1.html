<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Главная Посёлок Виля</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="logos/Group 1.png" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="routes.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&family=Great+Vibes&family=Manrope:wght@200..800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="route-scene">
          <div class="map-wrapper">
            <img src="gallery/маршрут1.jpg" alt="Карта маршрута" class="map-bg">
            <button type="button" class="map-point" style="--x: 48%; --y: 81%;" data-id="center" data-title="Храм Николая Чудотворца" data-short="Храм в центре Вили">
                <span class="map-point__num">1</span>
                <img src="gallery/церковь.png" alt="Никольская церковь" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 40%; --y: 81%;" data-id="memorial" data-title="Мемориал" data-short="Поселковый мемориал: Памятник в центре посёлка">
                <span class="map-point__num">2</span>
                <img src="gallery/мемориал.png" alt="Мемориал" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 32%; --y: 84%;" data-id="club" data-title="Клуб творчества" data-short="Дом творчества на берегу пруда">
                <span class="map-point__num">3</span>
                <img src="gallery/клуб.png" alt="Клуб" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 38%; --y: 84%;" data-id="train" data-title="Экспонат поезда" data-short="Напоминание о старой узкокалейке">
                <span class="map-point__num">4</span>
                <img src="gallery/поезд.png" alt="поезд" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 34%; --y: 87%;" data-id="naber" data-title="Набережная" data-short="Прогулочная зона у пруда">
                <span class="map-point__num">5</span>
                <img src="gallery/набер.png" alt="Набережная" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 12%; --y: 90%;" data-id="plotina" data-title="Плотина" data-short="Плотина на Вильском пруду">
                <span class="map-point__num">6</span>
                <img src="gallery/плотина.png" alt="Плотина" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 70%; --y: 80%;" data-id="vodonapor" data-title="Водонапорная башня" data-short="Красная кирпичная башня на улице Кирова">
                <span class="map-point__num">7</span>
                <img src="gallery/башня.png" alt="башня" class="map-point__img big_photo">
            </button>
            <button type="button" class="map-point" style="--x: 62%; --y: 80%;" data-id="bolnica" data-title="ГБУЗ НО 'Выксунская ЦРБ'" data-short="Местная больница в посёлке">
                <span class="map-point__num">8</span>
                <img src="gallery/новбольница.png" alt="Больница" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 50%; --y: 58%;" data-id="library" data-title="Библиотека р.п. виля на улице Выксунской" data-short="Поселковая библиотека">
                <span class="map-point__num">9</span>
                <img src="gallery/библиотека.png" alt="Библиотека" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 36%; --y: 53%;" data-id="school" data-title="МБОУ Вильская средняя школа" data-short="Школа в Виле">
                <span class="map-point__num">10</span>
                <img src="gallery/новшколаs.png" alt="Вильская школа" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 30%; --y: 54%;" data-id="child" data-title="МБОУ Детский сад №15" data-short="Детский сад в Виле">
                <span class="map-point__num">11</span>
                <img src="gallery/детсад.png" alt="Детский сад" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 50%; --y: 15%;" data-id="house" data-title="Дом Денисова" data-short="Старое здание в бывшей деревне Ляпуха">
                <span class="map-point__num">12</span>
                <img src="gallery/дом.png" alt="Бывшая школа" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 40%; --y: 13%;" data-id="apartament" data-title="Многоквартирный дом" data-short="Жилой дом в Ляпухе">
                <span class="map-point__num">13</span>
                <img src="gallery/квартиры.png" alt="Многоквартирный дом" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 27%; --y: 5%;" data-id="vyshka" data-title="Телевизионная вышка" data-short="Высокая телевышка">
                <span class="map-point__num">14</span>
                <img src="gallery/вышка.png" alt="Телевизионная вышка" class="map-point__img">
            </button>
            <button type="button" class="map-point" style="--x: 53%; --y: 3%;" data-id="karer" data-title="Кирпичный пруд" data-short="Водоём, известный как карьер">
                <span class="map-point__num">15</span>
                <img src="gallery/карьер.png" alt="карьер" class="map-point__img">
            </button>
            </div>
        </main>
        <div class="modal-backdrop" id="placeModal" hidden>
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <button type="button" class="modal-close" id="closeModal" aria-label="Закрыть">&times;</button>
                <h3 class="modal-title" id="modalTitle"></h3>
                <p class="modal-text" id="modalText"></p>
                <a href="place.html" class="modal-more-btn" id="modalMoreLink">Узнать больше</a>
            </div>
        </div>
        <script src="route.js"></script>
    </body>
</html>
